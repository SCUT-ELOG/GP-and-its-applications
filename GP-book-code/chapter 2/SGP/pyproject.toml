[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgp"
version = "0.1.0"
description = "Standard Genetic Programming for Symbolic Regression"
requires-python = ">=3.8"
dependencies = [
    "deap>=1.3.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = ["pmlb>=1.0.0"]
